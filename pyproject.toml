[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perch-head"
version = "0.1.0"
description = "Train and run custom classifier heads on Google Perch embeddings for bioacoustic species recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "keras",
    "tensorflow",
    "scikit-learn",
    "librosa",
    "soundfile",
    "resampy",       # librosa's res_type="kaiser_fast" resampler
    "kagglehub",     # fetches the Perch v2 checkpoint (google/bird-vocalization-classifier)
]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "pytest"]

[tool.setuptools.packages.find]
include = ["perch_head*"]
